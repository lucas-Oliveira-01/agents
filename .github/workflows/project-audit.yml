name: project-audit

on:
  push:
    paths:
      - "skills/universal/project-audit/**"
      - ".github/workflows/project-audit.yml"
  pull_request:
    paths:
      - "skills/universal/project-audit/**"
      - ".github/workflows/project-audit.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project-audit
        run: python -m pip install --upgrade pip && python -m pip install -e "skills/universal/project-audit[test]"

      - name: Compile source
        run: python -m compileall -q skills/universal/project-audit/src

      - name: Run tests
        run: python -m pytest -q skills/universal/project-audit/tests
