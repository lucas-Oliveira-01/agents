        run: python -m pytest -q skills/universal/project-audit/tests/test_phase19_recovery_lineage_integrity.py

  normalize-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install audit pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]"
          python -m pip install -e "skills/universal/audit-normalize"
          python -m pip install -e "skills/universal/omniroute-delegation"

      - name: Start deterministic MCP test gateway
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/mock_mcp.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          TOOL = {
              "name": "delegate_task",
              "description": "Deterministic CI test delegation tool",
              "inputSchema": {
                  "type": "object",
                  "properties": {
                      "task": {"type": "string"},
                      "profile": {"type": "string"},
                      "context": {"type": "string"},
                      "task_id": {"type": "string"},
                      "session_id": {"type": "string"},
                      "cache_mode": {"type": "string"},
                      "cache_key": {"type": "string"},
                      "max_tokens": {"type": "integer"},
                      "temperature": {"type": "number"},
                  },
                  "required": ["task"],
              },
          }

          class Handler(BaseHTTPRequestHandler):
              def _send(self, body, status=200, headers=None):
                  payload = json.dumps(body).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  if headers:
                      for key, value in headers.items():
                          self.send_header(key, value)
                  self.end_headers()
                  self.wfile.write(payload)

              def do_GET(self):
                  if self.path == "/health":
                      self._send({"status": "ok"})
                  else:
                      self._send({"error": "not found"}, 404)

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  request = json.loads(self.rfile.read(length))
                  method = request.get("method")
                  request_id = request.get("id")

                  if method == "initialize":
                      self._send(
                          {
                              "jsonrpc": "2.0",
                              "id": request_id,
                              "result": {
                                  "protocolVersion": "2024-11-05",
                                  "capabilities": {},
                                  "serverInfo": {
                                      "name": "ci-mock-mcp",
                                      "version": "1.0.0",
                                  },
                              },
                          },
                          headers={"mcp-session-id": "ci-test-session"},
                      )
                  elif method == "tools/list":
                      self._send(
                          {
                              "jsonrpc": "2.0",
                              "id": request_id,
                              "result": {"tools": [TOOL]},
                          }
                      )
                  elif method == "tools/call":
                      self._send(
                          {
                              "jsonrpc": "2.0",
                              "id": request_id,
                              "result": {
                                  "content": [
                                      {
                                          "type": "text",
                                          "text": json.dumps({"findings": []}),
                                      }
                                  ]
                              },
                          }
                      )
                  else:
                      self._send(
                          {
                              "jsonrpc": "2.0",
                              "id": request_id,
                              "error": {
                                  "code": -32601,
                                  "message": "Method not found",
                              },
                          },
                          status=400,
                      )

              def log_message(self, *_args):
                  pass

          HTTPServer(("127.0.0.1", 20130), Handler).serve_forever()
          PY
          python "$RUNNER_TEMP/mock_mcp.py" &
          echo $! > "$RUNNER_TEMP/mock_mcp.pid"
          for _ in {1..30}; do
            if curl --silent --fail http://127.0.0.1:20130/health >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          echo "mock MCP gateway did not start" >&2
          exit 1

      - name: Execute full audit and normalize
        shell: bash
        run: |
          set -euo pipefail
          trap 'kill "$(cat "$RUNNER_TEMP/mock_mcp.pid")" 2>/dev/null || true' EXIT
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/src"
          printf "print('ok')\n" > "$tmp/src/app.py"
          OMNIROUTE_MCP_URL="http://127.0.0.1:20130/mcp"             python -m project_audit --target "$tmp" --phase full --normalize --normalize-command audit-normalize
