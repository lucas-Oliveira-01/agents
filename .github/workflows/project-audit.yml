name: project-audit

on:
  push:
    paths:
      - "skills/universal/project-audit/**"
      - "skills/universal/audit-normalize/**"
      - "skills/universal/omniroute-delegation/**"
      - ".github/workflows/project-audit.yml"
  pull_request:
    paths:
      - "skills/universal/project-audit/**"
      - "skills/universal/audit-normalize/**"
      - "skills/universal/omniroute-delegation/**"
      - ".github/workflows/project-audit.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]" -e "skills/universal/audit-normalize" -e "skills/universal/omniroute-delegation"

      - name: Compile source
        run: python -m compileall -q skills/universal/project-audit/src

      - name: Run tests
        run: python -m pytest -q skills/universal/project-audit/tests


  phase8-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]" -e "skills/universal/audit-normalize" -e "skills/universal/omniroute-delegation"

      - name: Compile source
        run: python -m compileall -q skills/universal/project-audit/src

      - name: Run Phase 8 operational acceptance
        run: python -m pytest -q skills/universal/project-audit/tests/test_phase8_operational.py


  phase9-classification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]" -e "skills/universal/audit-normalize" -e "skills/universal/omniroute-delegation"

      - name: Run deterministic classification tests
        run: python -m pytest -q skills/universal/project-audit/tests/test_classification_layer.py


  phase10-incremental:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]" -e "skills/universal/audit-normalize" -e "skills/universal/omniroute-delegation"

      - name: Run Phase 10 incremental acceptance
        run: python -m pytest -q skills/universal/project-audit/tests/test_phase10_incremental.py


  phase11-change-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]" -e "skills/universal/audit-normalize" -e "skills/universal/omniroute-delegation"

      - name: Run Phase 11 change impact acceptance
        run: python -m pytest -q skills/universal/project-audit/tests/test_phase11_change_impact.py


  phase12-classification-lineage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]" -e "skills/universal/audit-normalize" -e "skills/universal/omniroute-delegation"

      - name: Run Phase 12 classification lineage acceptance
        run: python -m pytest -q skills/universal/project-audit/tests/test_phase12_classification_lineage.py


  phase13-applicability-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]" -e "skills/universal/audit-normalize" -e "skills/universal/omniroute-delegation"

      - name: Run Phase 13 applicability coverage acceptance
        run: python -m pytest -q skills/universal/project-audit/tests/test_phase13_applicability_coverage.py

  phase14-security-applicability-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]" -e "skills/universal/audit-normalize" -e "skills/universal/omniroute-delegation"

      - name: Run Phase 14 security applicability coverage acceptance
        run: python -m pytest -q skills/universal/project-audit/tests/test_phase14_security_applicability_coverage.py

  normalize-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install audit pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "skills/universal/project-audit[test]"
          python -m pip install -e "skills/universal/audit-normalize"

      - name: Execute full audit and normalize
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/src"
          printf "print('ok')\n" > "$tmp/src/app.py"
          python -m project_audit --target "$tmp" --phase full --normalize --normalize-command audit-normalize
