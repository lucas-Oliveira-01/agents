name: Phase 20 Evidence Immutability

on:
  push:
    branches: [phase20-evidence-immutability-drift]
  pull_request:
    branches: [main]

jobs:
  phase20-evidence-immutability-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e 'skills/universal/project-audit[test]'
      - name: Run Phase 20 evidence immutability acceptance
        run: python -m pytest -q skills/universal/project-audit/tests/test_phase20_evidence_immutability_drift.py
