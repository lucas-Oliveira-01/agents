[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-audit"
version = "0.2.0"
description = "Swarm-aware project-audit orchestration system with deterministic evidence lifecycle."
readme = "SKILL.md"
requires-python = ">=3.9"
dependencies = [
    "jsonschema>=4.18",
    "referencing>=0.35",
    "omniroute-delegation",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_audit = ["references/*", "schemas/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.uv.sources]
omniroute-delegation = { path = "../omniroute-delegation" }
