[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omniroute-delegation"
version = "1.2.0"
description = "Universal delegation skill for MCP-based agentic routing via OmniRoute gateway."
readme = "SKILL.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "jsonschema>=4.18",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]
lint = [
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
omniroute-smoke = "omniroute_delegation.smoke_test:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omniroute_delegation = ["references/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.black]
line-length = 99
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
