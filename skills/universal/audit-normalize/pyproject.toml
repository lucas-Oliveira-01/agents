[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-normalize"
version = "1.0.0"
description = "Canonical semantic normalizer and validator for Markdown technical audit documents."
readme = "SKILL.md"
requires-python = ">=3.9"
dependencies = [
    "markdown>=3.4",
    "jsonschema>=4.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
audit-normalize = "audit_normalize.normalize:main"
audit-validate = "audit_normalize.validator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audit_normalize = ["references/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
