name: omniroute

services:
  omniroute:
    image: docker.io/diegosouzapw/omniroute:3.8.50
    container_name: omniroute
    restart: unless-stopped
    init: true
    stop_grace_period: 40s

    # 8 GiB V8 heap + native/runtime headroom inside a 10 GiB cgroup.
    # This follows OmniRoute's current Docker guidance for one coding-agent
    # workload. The 10 GiB value is a ceiling, not a reservation.
    mem_limit: ${OMNIROUTE_CONTAINER_MEMORY:-10g}

    env_file:
      - .env

    environment:
      NODE_ENV: production
      CONTAINER_HOST: docker

      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-omniroute:}

      PORT: ${PORT:-20128}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-20128}
      API_PORT: ${API_PORT:-20129}
      API_HOST: ${API_HOST:-0.0.0.0}

      LIVE_WS_PORT: ${LIVE_WS_PORT:-20132}
      LIVE_WS_HOST: ${LIVE_WS_HOST:-127.0.0.1}
      LIVE_WS_ALLOWED_ORIGINS: ${LIVE_WS_ALLOWED_ORIGINS:-http://127.0.0.1:20128,http://localhost:20128}

      APP_BIND_HOST: ${APP_BIND_HOST:-127.0.0.1}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      ALLOW_API_KEY_REVEAL: ${ALLOW_API_KEY_REVEAL:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:20128}

      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB:-8192}
      OUTBOUND_SSRF_GUARD_ENABLED: ${OUTBOUND_SSRF_GUARD_ENABLED:-true}
      OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS: ${OMNIROUTE_ALLOW_PRIVATE_PROVIDER_URLS:-false}

      # Retain useful telemetry without enabling verbose debug logging.
      APP_LOG_TO_FILE: ${APP_LOG_TO_FILE:-true}
      CHAT_LOG_MAX_BODY_KB: ${CHAT_LOG_MAX_BODY_KB:-4096}
      PROXY_LOGS_TABLE_MAX_ROWS: ${PROXY_LOGS_TABLE_MAX_ROWS:-100000}

      # Current official defaults; explicit values make this deployment stable.
      PRICING_SYNC_ENABLED: ${PRICING_SYNC_ENABLED:-true}
      PRICING_SYNC_INTERVAL: ${PRICING_SYNC_INTERVAL:-86400}
      PRICING_SYNC_SOURCES: ${PRICING_SYNC_SOURCES:-litellm}
      ARENA_ELO_SYNC_ENABLED: ${ARENA_ELO_SYNC_ENABLED:-true}
      ARENA_ELO_SYNC_INTERVAL: ${ARENA_ELO_SYNC_INTERVAL:-86400}
      MODELS_CATALOG_PREFIX_MODE: ${MODELS_CATALOG_PREFIX_MODE:-dual}

      # Security/diagnostic behavior for untrusted project data.
      # Keep this as observation at the gateway; the project's trust boundary
      # remains the agent/orchestrator layer.
      INPUT_SANITIZER_ENABLED: ${INPUT_SANITIZER_ENABLED:-true}
      INPUT_SANITIZER_MODE: ${INPUT_SANITIZER_MODE:-warn}
      INPUT_SANITIZER_BLOCK_THRESHOLD: ${INPUT_SANITIZER_BLOCK_THRESHOLD:-high}

      # Stronger MCP posture if the native OmniRoute MCP is enabled later.
      OMNIROUTE_MCP_ENFORCE_SCOPES: ${OMNIROUTE_MCP_ENFORCE_SCOPES:-true}

    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}"
      - "${APP_BIND_HOST:-127.0.0.1}:${API_PORT:-20129}:${API_PORT:-20129}"
      - "${APP_BIND_HOST:-127.0.0.1}:${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"

    volumes:
      - omniroute-data:/app/data

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: omniroute-redis
    restart: unless-stopped

    # Redis is intentionally NOT published to the host. OmniRoute reaches it
    # through the private Compose network at redis:6379.
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  omniroute-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: omniroute-gateway
    restart: unless-stopped

    environment:
      # Uses Docker internal DNS — never localhost.
      OMNIROUTE_URL: "http://omniroute:${API_PORT:-20129}"
      OMNIROUTE_API_KEY: "${OMNIROUTE_API_KEY}"
      GATEWAY_PORT: "8000"
      OMNIROUTE_WRAPPER_STATE_DIR: "/state"

    ports:
      - "127.0.0.1:20130:8000"

    volumes:
      - gateway-state:/state

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    depends_on:
      omniroute:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  omniroute-data:
    name: omniroute-data
  redis-data:
    name: omniroute-redis-data
  gateway-state:
    name: omniroute-gateway-state
